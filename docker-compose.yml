# PRT362S — Eben Supply | Group KN3
#
#   docker compose up -d --build      start (first run builds the image)
#   open http://localhost:8080
#   docker compose logs -f app        see errors
#   docker compose down               stop (data is kept)
#   docker compose down -v            stop and wipe the database and uploads

name: eben-supply

services:
  app:
    build: .
    image: eben-supply:latest
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "Eben Supply"
      APP_ENV: local
      APP_DEBUG: "true"
      # Taken from .env when present; otherwise the container makes one
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:${APP_PORT:-8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eben_supply
      DB_USERNAME: eben
      DB_PASSWORD: eben_secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # Pinned: the mysql:8.4 tag (8.4.13, published 2026-11-03) unpacks with
    # empty binaries; 8.4.11 is the newest 8.4 release that works
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: eben_supply
      MYSQL_USER: eben
      MYSQL_PASSWORD: eben_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      # 3307 so it doesn't clash with a MySQL already running on this PC
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once MySQL has finished its first-run setup
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
  app-storage:
